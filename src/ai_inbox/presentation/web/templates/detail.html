{% extends 'base.html' %}
{% block body %}
<main class="max-w-3xl mx-auto p-5 md:p-10" data-detail="{{ kind }}" data-id="{{ id }}" data-timezone="{{ timezone }}">
<a href="/?view={{ 'drafts' if kind == 'draft' else 'digests' }}" class="btn btn-ghost btn-sm mb-7">← В рабочее пространство</a>
<div class="card bg-base-100 border border-base-300 shadow-sm"><div class="card-body p-6 md:p-9"><div class="badge badge-outline mb-3">{{ 'Локальный черновик · не отправлен' if kind == 'draft' else 'Дайджест' }}</div><h1 id="detail-title" class="text-2xl font-bold">Загрузка…</h1><p id="detail-meta" class="text-xs opacity-50"></p>
{% if kind == 'draft' %}
<form id="edit-draft-form" class="grid gap-5 mt-5"><label class="grid gap-2 text-sm">Тема<input class="input w-full" name="subject" required maxlength="1000"></label><label class="grid gap-2 text-sm">Текст ответа<textarea name="body" class="textarea w-full min-h-80 leading-7" required maxlength="20000"></textarea></label><button class="btn btn-primary justify-self-start">Сохранить изменения</button><span id="saved-state" role="status" class="text-sm opacity-60"></span></form>
{% else %}
<div id="digest-body" class="markdown-body my-5"></div><div id="digest-sources" class="grid gap-2"></div><button id="digest-speak" class="btn btn-primary justify-self-start mt-5">♫ Озвучить дайджест</button><div id="digest-audio"></div>
{% endif %}
</div></div></main><div id="notifications" class="toast toast-bottom toast-center z-50" aria-live="assertive"></div><script src="/static/app.js" defer></script>
{% endblock %}
