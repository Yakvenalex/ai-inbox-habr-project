[project]
name = "ai-inbox"
version = "0.1.0"
description = "Локальный мультимодальный помощник для почты и задач"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.120,<1", "uvicorn>=0.38,<1", "pydantic-settings>=2.11,<3",
  "sqlalchemy[asyncio]>=2.0.44,<3", "aiosqlite>=0.21,<1", "alembic>=1.17,<2",
  "openai-agents==0.24.0", "openai==3.49.0", "httpx[socks]>=0.28,<1", "apscheduler>=3.11,<4",
  "jinja2>=3.1.6,<4", "python-multipart>=0.0.20,<1", "pyjwt>=2.10,<3",
  "pillow>=12,<13", "num2words>=0.5.14,<1"
]
[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.14,<1", "mypy>=1.18,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ai_inbox"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
[tool.mypy]
python_version = "3.12"
files = ["src/ai_inbox/domain", "src/ai_inbox/application"]
strict = true
